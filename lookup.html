<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#9b111a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Check Booking Status - USTED Guidance &amp; Counselling</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #9b111a;
            --primary-dark: #7a0d15;
            --primary-light: rgba(155,17,26,0.08);
            --gold: #c49a2a;
            --bg-body: #f5f2ef;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #555;
            --text-muted: #888;
            --border: #e4e1de;
            --border-focus: #9b111a;
            --success: #16a34a;
            --success-bg: rgba(22,163,74,0.08);
            --warning: #ca8a04;
            --warning-bg: rgba(202,138,4,0.1);
            --info: #2563eb;
            --info-bg: rgba(37,99,235,0.08);
            --error: #dc2626;
            --error-bg: rgba(220,38,38,0.08);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --shadow: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --transition: 200ms cubic-bezier(0.4,0,0.2,1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            background-image:
                radial-gradient(ellipse 80% 60% at 0% 0%, rgba(155,17,26,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 70% 55% at 100% 100%, rgba(196,154,42,0.15) 0%, transparent 60%);
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text);
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0;
            margin: 0;
        }
        .page-wrap {
            width: 100%;
            max-width: 540px;
            padding: 16px 12px calc(env(safe-area-inset-bottom, 16px) + 16px);
            margin: 0 auto;
        }
        @media (min-width: 640px) {
            body { align-items: center; }
            .page-wrap { padding: 32px 16px; }
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(150deg, var(--primary-dark) 0%, var(--primary) 50%, #b01520 100%);
            padding: 28px 20px 36px;
            text-align: center;
            position: relative;
            color: #fff;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 24px;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
        }
        .logo {
            width: 64px; height: 64px;
            background: #fff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center; justify-content: center;
            padding: 5px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            margin-bottom: 12px;
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .header-sub {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        .header-title {
            font-size: 1.35rem;
            font-weight: 700;
        }
        .header-hint {
            font-size: 0.82rem;
            opacity: 0.75;
            margin-top: 4px;
        }
        @media (min-width: 640px) {
            .logo { width: 76px; height: 76px; }
            .header { padding: 32px 24px 40px; }
            .header-title { font-size: 1.5rem; }
        }

        /* ── Form Body ── */
        .form-body { padding: 8px 20px 24px; }

        /* ── Fields ── */
        .field { margin-bottom: 14px; }
        .field-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            -webkit-appearance: none;
            appearance: none;
        }
        .input::placeholder { color: var(--text-muted); }
        .input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(155,17,26,0.1);
        }
        .input-icon-wrap {
            position: relative;
        }
        .input-icon-wrap .input { padding-left: 40px; }
        .input-icon-wrap i {
            position: absolute;
            left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--primary);
            font-size: 0.95rem;
            pointer-events: none;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── Submit ── */
        .submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 52px;
            margin-top: 4px;
            padding: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--primary) 0%, #8a0f17 100%);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(155,17,26,0.35);
            transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:hover { box-shadow: 0 8px 28px rgba(155,17,26,0.45); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .submit-btn .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        .submit-btn.loading .spinner { display: block; }
        .submit-btn.loading .btn-icon { display: none; }
        .submit-btn.loading .btn-text { display: none; }
        .submit-btn.loading::after { content: 'Searching...'; font-weight: 600; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Results ── */
        .results-container { display: none; margin-top: 16px; }
        .results-container.show { display: block; }

        .result-card {
            background: #f9f8f6;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .result-ref {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.05rem;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-Pending { background: var(--warning-bg); color: var(--warning); }
        .status-Accepted { background: var(--success-bg); color: var(--success); }
        .status-Scheduled { background: var(--info-bg); color: var(--info); }
        .status-Completed { background: rgba(108,117,125,0.1); color: #6c757d; }
        .status-Rejected { background: var(--error-bg); color: var(--error); }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .result-grid dt { font-weight: 600; color: var(--text); }
        .result-grid dd { margin: 0; }
        .result-full { grid-column: 1 / -1; }
        .result-reason {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            animation: fadeIn 0.3s ease;
        }
        .empty-state i {
            font-size: 2.5rem;
            color: var(--border);
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* ── Back link ── */
        .back-link {
            text-align: center;
            padding: 16px 20px 20px;
            border-top: 1px solid var(--border);
            margin-top: 4px;
        }
        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .back-link a:hover { background: var(--primary-light); }

        /* ── Footer ── */
        .footer-text {
            text-align: center;
            padding: 0 20px 4px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Safe area ── */
        @supports (padding-top: env(safe-area-inset-top)) {
            .header { padding-top: calc(28px + env(safe-area-inset-top)); }
        }
    </style>
</head>
<body>

<div class="page-wrap">
    <div class="card">
        <div class="header">
            <div class="logo">
                <img src="usted_logo.png" alt="USTED Logo">
            </div>
            <p class="header-sub">Guidance &amp; Counselling Centre</p>
            <h1 class="header-title">Check Booking Status</h1>
            <p class="header-hint">Enter your reference number or phone number</p>
        </div>

        <div class="form-body">
            <form id="lookupForm" novalidate>
                <div class="field">
                    <label class="field-label" for="refInput">Booking Reference</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-hash"></i>
                        <input class="input" type="text" id="refInput"
                               placeholder="e.g. BK-2026-0001" autocomplete="off">
                    </div>
                </div>

                <div class="divider"><span>or</span></div>

                <div class="field">
                    <label class="field-label" for="phoneInput">Phone Number</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-telephone"></i>
                        <input class="input" type="tel" id="phoneInput"
                               placeholder="e.g. 0240000000" inputmode="tel" autocomplete="tel">
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="lookupBtn">
                    <span class="spinner"></span>
                    <i class="bi bi-search btn-icon"></i>
                    <span class="btn-text">Look Up</span>
                </button>
            </form>

            <div class="results-container" id="results"></div>

            <div class="back-link">
                <a href="index.html"><i class="bi bi-arrow-left"></i> Back to Booking</a>
            </div>

            <p class="footer-text">
                Walk-ins are welcome.<br>
                <strong>USTED Kumasi Campus - GCC (ROB 1st Floor, Room 30)</strong>
            </p>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';
    const API_BASE = 'https://usted-gcc-system.vercel.app';
    const form = document.getElementById('lookupForm');
    const resultsEl = document.getElementById('results');
    const btn = document.getElementById('lookupBtn');

    form.addEventListener('submit', async e => {
        e.preventDefault();
        const ref = document.getElementById('refInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();

        if (!ref && !phone) {
            Swal.fire({
                icon: 'warning',
                title: 'Enter Something',
                text: 'Please provide a reference number or phone number.',
                confirmButtonColor: '#9b111a'
            });
            return;
        }

        btn.classList.add('loading');
        btn.disabled = true;
        resultsEl.classList.remove('show');

        try {
            const resp = await fetch(API_BASE + '/api/lookup_booking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reference: ref, phone: phone })
            });
            const data = await resp.json();

            if (data.status === 'success' && data.bookings && data.bookings.length > 0) {
                let html = '';
                data.bookings.forEach(b => {
                    const dateStr = b.preferred_date || 'TBD';
                    const timeStr = b.preferred_time || 'TBD';
                    const status = b.status || 'Unknown';
                    html += `
                    <div class="result-card">
                        <div class="result-header">
                            <span class="result-ref">${b.reference}</span>
                            <span class="status-badge status-${status}">${status}</span>
                        </div>
                        <div class="result-grid">
                            <div><dt>Date</dt><dd>${dateStr}</dd></div>
                            <div><dt>Time</dt><dd>${timeStr}</dd></div>
                            <div class="result-full"><dt>Programme</dt><dd>${b.programme || 'N/A'}</dd></div>
                            ${b.reason ? `<div class="result-full"><dt>Reason</dt><dd>${b.reason}</dd></div>` : ''}
                        </div>
                    </div>`;
                });
                resultsEl.innerHTML = html;
            } else {
                resultsEl.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h3>No bookings found</h3>
                    <p>Please check your reference number or phone number and try again.</p>
                </div>`;
            }
            resultsEl.classList.add('show');
        } catch(err) {
            Swal.fire({
                icon: 'error',
                title: 'Connection Error',
                text: 'Could not reach the system. Please try again.',
                confirmButtonColor: '#9b111a'
            });
        } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
